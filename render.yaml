services:
  - type: web
    name: finshield
    runtime: python
    region: oregon
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: NODE_VERSION
        value: "20.11.1"
